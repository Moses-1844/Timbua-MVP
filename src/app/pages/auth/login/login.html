<div class="login-container">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="login-card">
          <!-- Header Section -->
          <div class="login-header text-center mb-4">
            <div class="logo d-flex align-items-center justify-content-center mb-3">
              <div class="logo-icon me-3">T</div>
              <h1 class="mb-0">Timbua</h1>
            </div>
            <p class="welcome-text mb-0">Welcome back! Please sign in to your account.</p>
          </div>

          <!-- Login Form -->
          <form (ngSubmit)="onSubmit()" class="login-form">
            <!-- Email Input -->
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input
                type="email"
                id="email"
                [(ngModel)]="credentials.email"
                name="email"
                class="form-control"
                placeholder="Enter your email"
                required
              >
            </div>

            <!-- Password Input -->
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input
                type="password"
                id="password"
                [(ngModel)]="credentials.password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                required
              >
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="rememberMe">
                <label class="form-check-label" for="rememberMe">
                  Remember me
                </label>
              </div>
              <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn login-button w-100"
              [disabled]="isLoading || !credentials.email || !credentials.password"
            >
              <span *ngIf="!isLoading">Sign In</span>
              <span *ngIf="isLoading" class="d-flex align-items-center justify-content-center">
                <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                Signing in...
              </span>
            </button>
          </form>

          <!-- Footer -->
            <!-- Footer -->
            <div class="login-footer text-center mt-4 pt-3">
            <p class="mb-0">
                Don't have an account?
                <a [routerLink]="['/register']" class="signup-link">Sign up</a>
            </p>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>

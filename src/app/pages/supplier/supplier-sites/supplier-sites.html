<div class="container" *ngIf="!loading; else loadingTpl">

  <h2 class="title">Sites for Supplier #{{ supplierId }}</h2>

  <mat-card *ngIf="sites.length === 0" class="empty">
    No sites found for this supplier.
  </mat-card>

  <mat-table *ngIf="sites.length > 0" [dataSource]="sites" class="mat-elevation-z2">

    <!-- Site Name -->
    <ng-container matColumnDef="name">
      <mat-header-cell *matHeaderCellDef> Site Name </mat-header-cell>
      <mat-cell *matCellDef="let site"> {{ site.name }} </mat-cell>
    </ng-container>

    <!-- Location -->
    <ng-container matColumnDef="location">
      <mat-header-cell *matHeaderCellDef> Location </mat-header-cell>
      <mat-cell *matCellDef="let site"> {{ site.location }} </mat-cell>
    </ng-container>

    <!-- Status -->
    <ng-container matColumnDef="status">
      <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
      <mat-cell *matCellDef="let site"> {{ site.status }} </mat-cell>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
      <mat-cell *matCellDef="let site">
        <button mat-button color="primary" [routerLink]="['/contractor/materials/site', site.id]">View</button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="['name', 'location', 'status', 'actions']"></mat-header-row>
    <mat-row *matRowDef="let row; columns: ['name', 'location', 'status', 'actions'];"></mat-row>
  </mat-table>

</div>

<ng-template #loadingTpl>
  <div class="loading">
    <mat-spinner></mat-spinner>
    <p>Loading sites...</p>
  </div>
</ng-template>
